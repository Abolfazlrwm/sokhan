[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokhan-bot"
description = "Telegram bot for Sokhan: send a voice message, receive the transcript"
requires-python = ">=3.10"
authors = [{ name = "Abolfazl Ranjbaran", email = "206173650+Abolfazlrwm@users.noreply.github.com" }]
license = { text = "MIT" }
keywords = ["persian", "farsi", "telegram-bot", "asr", "transcription", "aiogram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dynamic = ["version"]
dependencies = [
    "aiogram>=3.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.urls]
Homepage = "https://abolfazlrwm.github.io/sokhan/"
Repository = "https://github.com/Abolfazlrwm/sokhan"
Issues = "https://github.com/Abolfazlrwm/sokhan/issues"
Changelog = "https://github.com/Abolfazlrwm/sokhan/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["sokhan_bot*"]

[tool.setuptools.dynamic]
# Single source of truth: sokhan_bot.__version__ tracks the release tag.
version = { attr = "sokhan_bot.__version__" }
