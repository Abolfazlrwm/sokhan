[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokhan-bot"
version = "0.1.0"
description = "Telegram bot for Sokhan: send a voice message, receive the transcript"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["sokhan_bot*"]
