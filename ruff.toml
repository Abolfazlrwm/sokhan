line-length = 100
target-version = "py310"

# Jupyter/Colab cells follow notebook conventions (shell magics, #@param
# pragmas, imports mid-cell), not the repo's Python style.
extend-exclude = ["*.ipynb"]

[lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[lint.per-file-ignores]
"backend/tests/*" = ["E501"]
"backend/alembic/versions/*" = ["E501"]
"bot/tests/*" = ["E501"]
