[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokhan-backend"
version = "0.1.0"
description = "Persian-first speech-to-text engine and REST API for Sokhan"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery[redis]>=5.3",
    "faster-whisper>=1.0",
    # faster-whisper's decoder relies on PyAV APIs removed in newer majors
    "av>=11,<14",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9"]
# Neural speaker diarization (gated HF weights + a token are also required).
# Without these extras the pyannote engine falls back to the stub automatically.
diarize = ["torch>=2.1", "pyannote.audio>=3.1"]

[tool.setuptools.packages.find]
include = ["sokhan*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = "alembic"
