[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokhan-backend"
description = "Persian-first speech-to-text engine and REST API for Sokhan"
requires-python = ">=3.10"
authors = [{ name = "Abolfazl Ranjbaran", email = "206173650+Abolfazlrwm@users.noreply.github.com" }]
license = { text = "MIT" }
keywords = ["persian", "farsi", "speech-to-text", "asr", "whisper", "fastapi", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery[redis]>=5.3",
    "faster-whisper>=1.0",
    # faster-whisper's decoder relies on PyAV APIs removed in newer majors
    "av>=11,<14",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
]

[project.urls]
Homepage = "https://abolfazlrwm.github.io/sokhan/"
Repository = "https://github.com/Abolfazlrwm/sokhan"
Issues = "https://github.com/Abolfazlrwm/sokhan/issues"
Changelog = "https://github.com/Abolfazlrwm/sokhan/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9", "pytest-cov>=5"]
# Neural speaker diarization (gated HF weights + a token are also required).
# Without these extras the pyannote engine falls back to the stub automatically.
diarize = ["torch>=2.1", "pyannote.audio>=3.1"]

[tool.setuptools.packages.find]
include = ["sokhan*"]

[tool.setuptools.dynamic]
# Single source of truth: sokhan.__version__ tracks the release tag.
version = { attr = "sokhan.__version__" }

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = "alembic"
