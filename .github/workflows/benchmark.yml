name: Benchmark gate (weekly)

# Re-runs the fixed Common Voice (fa) fixture against the recorded baseline
# (benchmarks/results/baseline.json) and fails if any guarded engine loses
# more than one WER point — guards engine/dependency upgrades (roadmap v1.4).
on:
  schedule:
    # Mondays 03:17 UTC — deliberately off the hour.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the engine and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e backend
          python -m pip install -r benchmarks/requirements.txt

      - name: Run the fixture benchmark with the regression gate
        run: |
          python benchmarks/benchmark_wer.py \
            --models small medium large-v3-turbo \
            --baseline benchmarks/results/baseline.json \
            --max-regression 1.0 \
            --archive

      - name: Upload the archived session
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-session
          path: benchmarks/results
          retention-days: 90
