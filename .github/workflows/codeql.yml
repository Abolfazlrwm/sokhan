name: CodeQL

# Static security analysis (SAST) of the Python backend/bot and the
# Next.js dashboard. Results land in the repo's Security tab under
# "Code scanning" so vulnerabilities are visible, not guessed.
# Free for public repositories.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on top of every push: catches newly discovered
    # patterns in dependencies that never changed.
    - cron: "17 4 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            paths: backend bot training benchmarks space deploy
          - language: javascript-typescript
            paths: web
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # "none" build mode: modern CodeQL extracts JS/TS without a build;
          # Python needs no build either.
          build-mode: none
          queries: security-extended
      - if: matrix.language == 'javascript-typescript'
        name: Install web deps for extraction
        working-directory: web
        run: npm ci
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
