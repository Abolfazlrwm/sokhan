name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # needed to delete stale github-pages artifacts before upload
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      # deploy-pages fails when more than one artifact named
      # "github-pages" exists — with the default 90-day retention a
      # previous artifact survives until then, so every later deploy
      # would hit "multiple artifacts found". Delete stale ones first.
      - name: Remove stale github-pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --paginate --jq '.artifacts[] | select(.name == "github-pages") | .id' || true)
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && \
              echo "deleted stale artifact $id"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          retention-days: 3
      # The artifact metadata service is eventually consistent; when a
      # delete and an upload land in the same second, deploy-pages can
      # fetch an empty artifact list ("No artifacts named github-pages
      # were found"). Wait until the artifact is actually visible.
      - name: Wait for artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 15); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -ge 1 ]; then
              echo "github-pages artifact visible (attempt $i)"; exit 0
            fi
            echo "attempt $i: not visible yet"; sleep 3
          done
          echo "artifact never became visible"; exit 1
      # The Pages metadata service converges a few seconds AFTER the
      # Actions artifacts API does; a delete+upload in the same run makes
      # the first deploy attempt occasionally fetch an empty list. Two
      # attempts with a settle gap turn the race into a non-event.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Settle before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Fail if both attempts missed
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: exit 1
