name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # needed to delete stale github-pages artifacts before upload
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # deploy-pages fails when more than one artifact named
      # "github-pages" exists — with the default 90-day retention a
      # previous artifact survives until then, so every later deploy
      # would hit "multiple artifacts found". Delete stale ones first.
      - name: Remove stale github-pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --paginate --jq '.artifacts[] | select(.name == "github-pages") | .id' || true)
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && \
              echo "deleted stale artifact $id"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 3
      # The artifact metadata service is eventually consistent; when a
      # delete and an upload land in the same second, deploy-pages can
      # fetch an empty artifact list ("No artifacts named github-pages
      # were found"). Wait until the artifact is actually visible.
      - name: Wait for artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 15); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -ge 1 ]; then
              echo "github-pages artifact visible (attempt $i)"; exit 0
            fi
            echo "attempt $i: not visible yet"; sleep 3
          done
          echo "artifact never became visible"; exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
