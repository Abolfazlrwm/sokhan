name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the CI jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # backend/ and bot/ land in later PRs; set up caching only when they exist
      - name: Set up Python with pip cache
        if: ${{ hashFiles('backend/pyproject.toml') != '' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Set up Python
        if: ${{ hashFiles('backend/pyproject.toml') == '' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install backend and bot packages
        if: ${{ hashFiles('backend/pyproject.toml') != '' || hashFiles('bot/pyproject.toml') != '' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/pyproject.toml ]; then pip install -e "backend[dev]"; fi
          if [ -f bot/pyproject.toml ]; then pip install -e "bot[dev]"; fi
      - name: Lint (ruff)
        if: ${{ hashFiles('backend/**/*.py') != '' || hashFiles('bot/**/*.py') != '' }}
        run: |
          dirs="backend"
          if [ -d bot ]; then dirs="$dirs bot"; fi
          for extra in training benchmarks space deploy scripts; do
            if [ -d "$extra" ]; then dirs="$dirs $extra"; fi
          done
          ruff check $dirs
      - name: Type check (mypy)
        if: ${{ hashFiles('backend/sokhan/**/*.py') != '' }}
        run: mypy --config-file backend/pyproject.toml backend/sokhan
      - name: Tests
        if: ${{ hashFiles('backend/tests/*.py') != '' || hashFiles('bot/tests/*.py') != '' }}
        env:
          CELERY_ENABLED: "false"
          DATA_DIR: /tmp/sokhan-ci-data
        run: |
          test_dirs="backend/tests"
          if [ -d bot/tests ]; then test_dirs="$test_dirs bot/tests"; fi
          pytest -m "not gpu_optional" $test_dirs \
            --cov=sokhan --cov=sokhan_bot --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=json:coverage.json
          python scripts/coverage_summary.py coverage.json >> "${GITHUB_STEP_SUMMARY}"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node with npm cache
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Node
        if: ${{ hashFiles('web/package-lock.json') == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install dependencies
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npm ci
        working-directory: web
      - name: Build
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npm run build
        working-directory: web

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate compose file
        if: ${{ hashFiles('deploy/docker-compose.yml') != '' }}
        run: POSTGRES_PASSWORD=ci-placeholder docker compose -f deploy/docker-compose.yml config -q

      # Real integration smoke: bring up the actual stack the self-hoster
      # runs (postgres + redis + api), wait for /healthz, and assert the
      # public surfaces answer. Validates wiring the unit tests cannot see.
      - name: Smoke-test the compose stack
        if: ${{ hashFiles('deploy/docker-compose.yml') != '' }}
        env:
          POSTGRES_PASSWORD: ci-smoke-password
        run: |
          compose="docker compose -f deploy/docker-compose.yml"
          trap '$compose down -v --timeout 5' EXIT
          $compose up -d --build api
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/healthz > /tmp/health.json; then
              echo "healthz answered on attempt $i"; cat /tmp/health.json; break
            fi
            sleep 3
          done
          curl -sf http://localhost:8000/healthz > /dev/null || {
            echo "::error::API never became healthy"; $compose logs api; exit 1; }
          curl -sf http://localhost:8000/plans > /tmp/plans.json || {
            echo "::error::/plans failed"; exit 1; }
          python3 -c 'import json; plans={p["code"] for p in json.load(open("/tmp/plans.json"))["plans"]}; assert {"free","pro"} <= plans, plans; print("plans OK:", sorted(plans))'
          curl -sf http://localhost:8000/docs > /dev/null || {
            echo "::error::/docs failed"; exit 1; }
          echo "compose smoke: all surfaces OK"
