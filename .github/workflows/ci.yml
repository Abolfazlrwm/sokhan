name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # backend/ and bot/ land in later PRs; set up caching only when they exist
      - name: Set up Python with pip cache
        if: ${{ hashFiles('backend/pyproject.toml') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Set up Python
        if: ${{ hashFiles('backend/pyproject.toml') == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and bot packages
        if: ${{ hashFiles('backend/pyproject.toml') != '' || hashFiles('bot/pyproject.toml') != '' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/pyproject.toml ]; then pip install -e "backend[dev]"; fi
          if [ -f bot/pyproject.toml ]; then pip install -e "bot[dev]"; fi
      - name: Lint (ruff)
        if: ${{ hashFiles('backend/**/*.py') != '' || hashFiles('bot/**/*.py') != '' }}
        run: |
          dirs="backend"
          if [ -d bot ]; then dirs="$dirs bot"; fi
          ruff check $dirs
      - name: Type check (mypy)
        if: ${{ hashFiles('backend/sokhan/**/*.py') != '' }}
        run: mypy --config-file backend/pyproject.toml backend/sokhan
      - name: Tests
        if: ${{ hashFiles('backend/tests/*.py') != '' || hashFiles('bot/tests/*.py') != '' }}
        env:
          CELERY_ENABLED: "false"
          DATA_DIR: /tmp/sokhan-ci-data
        run: |
          test_dirs="backend/tests"
          if [ -d bot/tests ]; then test_dirs="$test_dirs bot/tests"; fi
          pytest -m "not gpu_optional" $test_dirs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node with npm cache
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Node
        if: ${{ hashFiles('web/package-lock.json') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npm ci
        working-directory: web
      - name: Build
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npm run build
        working-directory: web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        if: ${{ hashFiles('deploy/docker-compose.yml') != '' }}
        run: docker compose -f deploy/docker-compose.yml config -q
