name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and bot packages
        # bot/ lands in a later PR; install what exists.
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
          if [ -f bot/pyproject.toml ]; then pip install -e "bot[dev]"; fi
      - name: Lint (ruff)
        run: |
          dirs="backend"
          if [ -d bot ]; then dirs="$dirs bot"; fi
          ruff check $dirs
      - name: Type check (mypy)
        run: mypy --config-file backend/pyproject.toml backend/sokhan
      - name: Tests
        env:
          CELERY_ENABLED: "false"
          DATA_DIR: /tmp/sokhan-ci-data
        run: |
          test_dirs=""
          if [ -d backend/tests ]; then test_dirs="$test_dirs backend/tests"; fi
          if [ -d bot/tests ]; then test_dirs="$test_dirs bot/tests"; fi
          pytest -m "not gpu_optional" $test_dirs

  web:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('web/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  compose:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('deploy/docker-compose.yml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config -q
